[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-os-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
agentic-os = "agentic_os.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
