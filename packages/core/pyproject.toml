[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slate-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[project.scripts]
slate = "slate.cli.main:app"
slate-mcp = "slate.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
