[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:slate-api]
command=/app/.venv/bin/python -c "import sys; sys.path.insert(0, '/app/packages/core/src'); from slate.api.app import create_app; import uvicorn; uvicorn.run(create_app(), host='0.0.0.0', port=8000)"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/slate-api.log
stderr_logfile=/var/log/supervisor/slate-api-error.log
environment=PYTHONUNBUFFERED="1"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
