[project]
name = "slate"
version = "0.1.0"
description = "Shared kanban board for AI agents"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages/core/tests"]
