server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long cache headers
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
