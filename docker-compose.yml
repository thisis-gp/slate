services:
  slate:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    container_name: slate
    env_file:
      - .env
    ports:
      - "7331:80"
    volumes:
      - slate-data:/root/.slate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  slate-data:
    name: slate-data
